<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Importing a beautiful high-quality Arabic font to render the calligraphy crisply -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      .arabic-text {
        font-family: 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif;
        font-size: 34px;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Transparent background container -->
  <rect width="100%" height="100%" fill="none" />
  
  <!-- Rendered Arabic Text with full Tashkeel (diacritics) -->
  <text x="250" y="60" class="arabic-text" dir="rtl">لَا إِلٰهَ إِلَّا اللهُ مُحَمَّدٌ رَسُولُ اللهِ</text>
</svg>
